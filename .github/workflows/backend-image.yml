name: Build and deploy backend image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        options:
          - dev
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: image
        name: Set lowercase image name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record CI image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DIGEST"
          printf '### CI image (Oracle builds on the VM)\n\n- Source: `%s`\n- Image: `%s@%s`\n' "$REVISION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: ./.github/workflows/oracle-ssh.yml
    with:
      environment: dev

  deploy-prod:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: ./.github/workflows/oracle-ssh.yml
    with:
      environment: production
