name: Release approved revision on Oracle
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
permissions: {}
jobs:
  release:
    runs-on: [self-hosted, gdg-deploy]
    environment: ${{ inputs.environment }}
    steps:
      - name: Request release
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/hosts"
          ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/hosts" -i "$dir/key" "deploy@$DEPLOY_HOST" "$GITHUB_SHA"
