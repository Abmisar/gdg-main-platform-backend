name: gdg-oracle
x-runtime: &runtime
  platform: linux/arm64
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    app: {}
    egress:
      gw_priority: 1

services:
  backend:
    <<: *runtime
    container_name: gdg-backend
    image: gdg-backend:${RELEASE_TAG:?release tag required}
    build:
      context: ${BACKEND_SOURCE:-${HOME}/backend}
      dockerfile: Dockerfile
    env_file:
      - path: ${GDG_CONFIG:-${HOME}/.config/gdg}/backend.env
        format: raw
    deploy:
      replicas: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 30s
      timeout: 8s
      retries: 3
  frontend:
    <<: *runtime
    image: gdg-frontend:${RELEASE_TAG:?release tag required}
    build:
      context: ${FRONTEND_SOURCE:-${HOME}/frontend}
      dockerfile: Dockerfile.oracle
      args:
        API_PROXY_TARGET: ${API_BUILD_ORIGIN:-https://api.gdguj.org}
    env_file:
      - path: ${GDG_CONFIG:-${HOME}/.config/gdg}/frontend.env
        format: raw
    networks:
      app:
        aliases: [gdg-frontend]
      egress:
        gw_priority: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/colorful-logo.svg',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 3
  cloudflared:
    <<: *runtime
    image: ${TUNNEL_IMAGE:?tunnel image digest required}
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_METRICS: 127.0.0.1:2000
    env_file:
      - path: ${GDG_CONFIG:-${HOME}/.config/gdg}/tunnel.env
        format: raw
    healthcheck:
      test: [CMD, cloudflared, tunnel, ready]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  app:
    internal: true
  egress:
    driver: bridge
