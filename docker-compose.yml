services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  provision:
    image: postgres:17
    depends_on:
      db: { condition: service_healthy }
    environment: &admin_environment
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GDG_MIGRATION_PASSWORD: ${GDG_MIGRATION_PASSWORD:?Run ./gdg backend run}
      GDG_APP_PASSWORD: ${GDG_APP_PASSWORD:?Run ./gdg backend run}
      GDG_AUDIT_READER_PASSWORD: ${GDG_AUDIT_READER_PASSWORD:?Run ./gdg backend run}
    volumes:
      - ./docs/sql/field-access.sql:/roles.sql:ro
      - ./scripts/dev-role-passwords.sql:/passwords.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/roles.sql", "-f", "/passwords.sql"]

  migrate:
    build: { context: ., target: builder }
    depends_on:
      provision: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://gdg_migrate:${GDG_MIGRATION_PASSWORD}@db:5432/${POSTGRES_DB}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?Run ./gdg backend run}
      FIELD_ENCRYPTION_ACTIVE_VERSION: ${FIELD_ENCRYPTION_ACTIVE_VERSION:?Run ./gdg backend run}
      FIELD_BLIND_INDEX_KEY: ${FIELD_BLIND_INDEX_KEY:?Run ./gdg backend run}
    command: ["sh", "-ec", "pnpm prisma:migrate:deploy && node scripts/dev-field-rollout.mjs"]

  grants:
    image: postgres:17
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment: *admin_environment
    volumes:
      - ./docs/sql/field-access.sql:/roles.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/roles.sql"]

  backend:
    build:
      context: .
      target: builder
    command: ["sh", "-c", "exec pnpm start:dev"]
    depends_on:
      grants:
        condition: service_completed_successfully
    environment:
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-GDG on Campus UJ <noreply@gdguj.org>}
      DATABASE_URL: postgresql://gdg_app:${GDG_APP_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      AUDIT_READER_DATABASE_URL: postgresql://gdg_audit_reader:${GDG_AUDIT_READER_PASSWORD}@db:5432/${POSTGRES_DB}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
      FIELD_ENCRYPTION_ACTIVE_VERSION: ${FIELD_ENCRYPTION_ACTIVE_VERSION}
      FIELD_BLIND_INDEX_KEY: ${FIELD_BLIND_INDEX_KEY}
    ports:
      - "3001:3001"
    volumes:
      - ./src:/app/src
      - /app/src/generated

volumes:
  postgres_data:
  pgadmin_data:

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "GDG Local PostgreSQL",
            "Group": "Local development",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "SSLMode": "prefer"
          }
        }
      }
